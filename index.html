/* HOWZA Director Wheel — additive module. Long-press the chart (600ms) to open.
   Touches no existing logic; only clicks existing buttons / focuses existing inputs. */
(function(){
  var timer=null, wheel=null, sx=0, sy=0, pid=null, fired=false;
  function findBtnByTitle(t){ return document.querySelector('button[title="'+t+'"]'); }
  function clickText(tag, txt){
    var els=document.querySelectorAll(tag);
    for(var i=0;i<els.length;i++){ if((els[i].textContent||'').trim().indexOf(txt)===0) return els[i]; }
    return null;
  }
  function doAction(name){
    try{
      if(name==='story'){ var b=clickText('button','Export Story'); if(b) b.click(); }
      else if(name==='replay'){ var r=findBtnByTitle('Reset camera (double-tap)'); if(r) r.click(); }
      else if(name==='ai'){ var inp=document.querySelector('input[placeholder="Why are we selling?"]'); if(inp){ inp.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(function(){inp.focus();},450);} }
      else if(name==='ghost'){ var g=findBtnByTitle('Ghost scenarios'); if(g) g.click(); }
    }catch(e){}
  }
  function close(){ if(wheel&&wheel.parentNode) wheel.parentNode.removeChild(wheel); wheel=null; fired=false; }
  function open(x,y){
    close(); fired=true;
    wheel=document.createElement('div');
    wheel.style.cssText='position:fixed;z-index:9999;left:0;top:0;width:100vw;height:100vh;pointer-events:auto;';
    var items=[
      {n:'story', label:'Story', icon:'\u25B6'},
      {n:'replay', label:'Replay', icon:'\u21BA'},
      {n:'ai', label:'AI Explain', icon:'\u2728'},
      {n:'ghost', label:'Ghost', icon:'👁'}
    ];
    var html='<div style="position:absolute;left:'+(x-70)+'px;top:'+(y-70)+'px;width:140px;height:140px;">';
    items.forEach(function(it,i){
      var ang=-Math.PI/2 + i*(Math.PI/2);

    document.body.appendChild(wheel);
  }
  document.addEventListener('pointerdown', function(e){
    if(e.target && e.target.tagName==='CANVAS'){

    }
  }, true);
  document.addEventListener('pointermove', function(e){
    if(timer && pid===e.pointerId && Math.hypot(e.clientX-sx,e.clientY-sy)>12){ clearTimeout(timer); timer=null; }
  }, true);
  function end(e){
    if(timer){ clearTimeout(timer); timer=null; }
    if(wheel && !fired){ close(); }
  }
  document.addEventListener('pointerup', end, true);
  document.addEventListener('pointercancel', function(){ clearTimeout(timer); timer=null; close(); }, true);
})();
</script>
