            sel.appendChild(opt);
            added = true;
          }
        }
      });

      // For custom dropdowns, try to find and patch the instruments array in React
      // Look for global state
      if(window.localStorage){
        const instruments = ['BTCUSDT','PAXGUSDT','ETHUSDT','NAS100','US30'];
        localStorage.setItem('howza_instruments', JSON.stringify(instruments));
      }

      if(added) console.log("NAS100 US30 added to dropdowns");
      
      // Add badge
      const badge = document.createElement('div');
      badge.id = 'omega-x-nas100-badge';
      badge.textContent = 'OMEGA X • NAS100 + US30 ADDED • INSTRUMENT SWITCH FIXED • 3X A+++ • FOREVER VISIBLE';
      badge.style.cssText = 'position:fixed;top:54px;left:12px;z-index:99999;font-family:JetBrains Mono,monospace;font-size:9px;color:#00E5FF;background:rgba(0,229,255,0.12);border:1px solid rgba(0,229,255,0.4);padding:6px 10px;border-radius:9999px;letter-spacing:0.4px;pointer-events:none;';
      if(!document.getElementById('omega-x-nas100-badge')){
        document.body.appendChild(badge);
        setTimeout(()=>{ try{badge.remove()}catch(e){} }, 10000);
      }
    } catch(e){
      console.error("Add instruments error", e);
    }
  }

  // Fix instrument switch - clear klines buffer and reset WS
  function fixInstrumentSwitch(){
    try {
      // Override any global klines array clear on instrument change
      // Patch fetch or WS close
      const originalClose = WebSocket.prototype.close;
      WebSocket.prototype.close = function(...args){
        // Clear buffer when WS closes (instrument switch)
        try {
          if(window.klines) window.klines.length = 0;
        } catch(e){}
        return originalClose.apply(this, args);
      };
      
      console.log("Instrument switch fix - WS close patched to clear buffer");
    } catch(e){ console.error(e); }
  }

  if(document.readyState === 'complete'){
    setTimeout(()=>{ addInstrumentsToUI(); fixInstrumentSwitch(); }, 800);
  } else {
    window.addEventListener('load', ()=> setTimeout(()=>{ addInstrumentsToUI(); fixInstrumentSwitch(); }, 800));
  }
  
  // Retry adding instruments every 2 seconds for 10 seconds (React may re-render)
  let retries = 0;
  const interval = setInterval(()=>{
    addInstrumentsToUI();
    retries++;
    if(retries>5) clearInterval(interval);
  }, 2000);
})();
</script>
